<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Profile — TrueValue Dynasty</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface-2: #1a2234;
    --surface-3: #212d42;
    --border: #1e2a3a;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #475569;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.15);
    --green: #10b981;
    --green-bg: rgba(16, 185, 129, 0.1);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.1);
    --yellow: #f59e0b;
    --yellow-bg: rgba(245, 158, 11, 0.1);
    --purple: #a78bfa;
    --purple-bg: rgba(167, 139, 250, 0.1);
    --qb: #ef4444;
    --rb: #3b82f6;
    --wr: #10b981;
    --te: #f59e0b;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .container { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--text-muted);
    font-size: 0.8rem;
    font-weight: 500;
    margin-bottom: 1.25rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--text); text-decoration: none; }
  .back-link svg { width: 14px; height: 14px; }

  /* ── Player Header ── */
  .player-header {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
    margin-bottom: 1.5rem;
  }

  .player-photo {
    width: 100px;
    height: 100px;
    border-radius: 16px;
    background: var(--surface);
    border: 2px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .player-photo img { width: 100%; height: 100%; object-fit: cover; }
  .player-photo .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--text-dim);
  }

  .player-info { flex: 1; }
  .player-info h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }

  .player-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.4rem;
    flex-wrap: wrap;
  }

  .pos-badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 5px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .pos-QB { background: rgba(239,68,68,0.15); color: var(--qb); }
  .pos-RB { background: rgba(59,130,246,0.15); color: var(--rb); }
  .pos-WR { background: rgba(16,185,129,0.15); color: var(--wr); }
  .pos-TE { background: rgba(245,158,11,0.15); color: var(--te); }

  .tier-badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 5px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .tier-Elite { background: var(--purple-bg); color: var(--purple); }
  .tier-Star { background: var(--accent-glow); color: var(--accent); }
  .tier-Starter { background: var(--green-bg); color: var(--green); }
  .tier-Bench { background: var(--yellow-bg); color: var(--yellow); }
  .tier-Waiver { background: rgba(100,116,139,0.1); color: var(--text-muted); }

  .meta-text { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }

  .header-value {
    text-align: right;
    flex-shrink: 0;
  }
  .header-value .big-value {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .header-value .value-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 600;
    margin-top: 0.2rem;
  }
  .header-value .value-range-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.15rem;
  }
  .header-value .rank-text {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 700;
    margin-top: 0.3rem;
  }

  /* ── Grid Layout ── */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  @media (max-width: 768px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .player-header { flex-direction: column; }
    .header-value { text-align: left; }
  }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 0.75rem;
  }

  /* ── Value Breakdown ── */
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(30, 42, 58, 0.5);
  }

  /* Help icons with tooltips */
  .help-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 0.62rem;
    font-weight: 700;
    font-style: italic;
    font-family: Georgia, serif;
    cursor: help;
    margin-left: 0.35rem;
    position: relative;
    transition: all 0.15s;
    line-height: 1;
  }
  .help-icon:hover { background: var(--accent); color: white; }
  .help-icon .tooltip {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-3);
    color: var(--text);
    padding: 0.6rem 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 0.72rem;
    font-weight: 400;
    font-style: normal;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    width: 260px;
    text-align: left;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    z-index: 100;
    transition: opacity 0.15s;
    pointer-events: none;
    white-space: normal;
  }
  .help-icon .tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--surface-3);
  }
  .help-icon:hover .tooltip { visibility: visible; opacity: 1; }
  .help-icon .tooltip strong { color: var(--accent); font-weight: 600; }
  .help-icon .tooltip .ctx {
    display: block;
    margin-top: 0.4rem;
    padding-top: 0.4rem;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.68rem;
  }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .breakdown-value {
    font-size: 0.85rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .breakdown-bar-wrap {
    flex: 1;
    margin: 0 1rem;
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .breakdown-bar {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .breakdown-total {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
  }

  /* Value context section */
  .value-context {
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px dashed rgba(30, 42, 58, 0.8);
  }
  .context-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.6rem;
  }
  .context-big-label {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .context-tier-chip {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    background: var(--accent-glow);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .percentile-bar-group {
    margin-bottom: 0.75rem;
  }
  .percentile-bar-group:last-child { margin-bottom: 0; }
  .percentile-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
  }
  .percentile-bar-label .percentile-val {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .percentile-bar-track {
    width: 100%;
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .percentile-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
    background: linear-gradient(90deg, var(--accent) 0%, var(--purple) 100%);
  }
  .percentile-bar-fill.dim {
    background: linear-gradient(90deg, var(--text-dim) 0%, var(--text-muted) 100%);
  }

  /* ── Chart Canvas ── */
  .chart-container {
    position: relative;
    width: 100%;
    height: 220px;
  }
  .chart-container canvas {
    width: 100% !important;
    height: 100% !important;
  }

  /* ── Strengths / Weaknesses ── */
  .sw-list { list-style: none; }
  .sw-item {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid rgba(30, 42, 58, 0.3);
  }
  .sw-item:last-child { border-bottom: none; }
  .sw-icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    flex-shrink: 0;
    margin-top: 0.1rem;
  }
  .sw-icon.strength { background: var(--green-bg); color: var(--green); }
  .sw-icon.weakness { background: var(--red-bg); color: var(--red); }
  .sw-label {
    font-size: 0.8rem;
    font-weight: 600;
  }
  .sw-detail {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.1rem;
  }
  .impact-high { border-left: 3px solid var(--green); padding-left: 0.5rem; }
  .impact-high.weakness-item { border-left-color: var(--red); }

  /* ── Stats Table ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 0.5rem;
  }
  .stat-box {
    text-align: center;
    padding: 0.6rem 0.3rem;
    background: var(--surface-2);
    border-radius: 8px;
  }
  .stat-box .stat-val {
    font-size: 1.1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-box .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 600;
    margin-top: 0.15rem;
  }

  /* ── History Table ── */
  .history-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  .history-table th {
    text-align: left;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    padding: 0.4rem 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .history-table td {
    padding: 0.45rem 0.5rem;
    font-size: 0.8rem;
    border-bottom: 1px solid rgba(30, 42, 58, 0.3);
    font-variant-numeric: tabular-nums;
  }
  .history-table tr:hover { background: var(--surface-2); }

  /* ── Market Comparison ── */
  .rank-compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  .rank-compare-cell {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 0.65rem 0.75rem;
    text-align: center;
  }
  .rank-compare-cell .rank-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 600;
  }
  .rank-compare-cell .rank-primary {
    font-size: 1.3rem;
    font-weight: 700;
    margin-top: 0.15rem;
    font-variant-numeric: tabular-nums;
  }
  .rank-compare-cell .rank-sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 0.1rem;
    font-variant-numeric: tabular-nums;
  }
  .rank-diff-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-top: 0.25rem;
  }
  .rank-diff-bar .diff-num {
    font-size: 0.9rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .market-verdict {
    text-align: center;
    margin-top: 0.5rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .full-width { grid-column: 1 / -1; }

  /* ── Loading ── */
  .loading {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }
  .loading .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Loading player data...</div>
  </div>
</div>

<script>
let allPlayers = [];
let meta = {};

function getPlayerSlug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

async function init() {
  const res = await fetch('data.json');
  const json = await res.json();
  allPlayers = Array.isArray(json) ? json : json.players;
  meta = json.meta || {};

  const params = new URLSearchParams(window.location.search);
  const rank = parseInt(params.get('rank'));
  const slug = params.get('id');

  let player;
  if (rank) {
    player = allPlayers.find(p => p.rank === rank);
  } else if (slug) {
    player = allPlayers.find(p => getPlayerSlug(p.name) === slug);
  }

  if (!player) {
    document.getElementById('app').innerHTML = `
      <a href="index.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to Rankings</a>
      <div class="loading"><p>Player not found.</p></div>`;
    return;
  }

  renderPlayer(player);
}

function posColor(pos) {
  return { QB: 'var(--qb)', RB: 'var(--rb)', WR: 'var(--wr)', TE: 'var(--te)' }[pos] || 'var(--accent)';
}

function renderPlayer(p) {
  document.title = `${p.name} — TrueValue Dynasty`;

  const photoHtml = p.headshot
    ? `<img src="${p.headshot}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div class=placeholder>${p.name.split(' ').map(n=>n[0]).join('')}</div>'">`
    : `<div class="placeholder">${p.name.split(' ').map(n=>n[0]).join('')}</div>`;

  const teamStr = p.team ? ` · ${p.team}` : '';
  const missedStr = p.missed > 0 ? ` · <span style="color:var(--yellow)">${p.missed}yr missed</span>` : '';

  // Market comparison — rank-based (scale-independent, trade-actionable)
  let marketHtml = '';
  if (p.marketRank) {
    // Positional rank gap is the primary signal — cleaner than overall
    const posGap = p.marketPosRank - p.posRank;  // positive = model ranks higher
    const overallGap = p.marketRank - p.rank;

    // Verdict thresholds based on positional rank gap
    let verdict;
    if (posGap >= 3) verdict = { text: 'Strong Buy Signal', desc: 'Model rates meaningfully above market', cls: 'background:var(--green-bg);color:var(--green)' };
    else if (posGap >= 1) verdict = { text: 'Buy Lean', desc: 'Model slightly higher than market', cls: 'background:rgba(16,185,129,0.06);color:#4ade80' };
    else if (posGap <= -3) verdict = { text: 'Strong Sell Signal', desc: 'Market values well above model', cls: 'background:var(--red-bg);color:var(--red)' };
    else if (posGap <= -1) verdict = { text: 'Sell Lean', desc: 'Model slightly lower than market', cls: 'background:rgba(239,68,68,0.06);color:#fb923c' };
    else verdict = { text: 'Aligned With Market', desc: 'Model and market agree', cls: 'background:var(--surface-2);color:var(--text-muted)' };

    const gapStr = (n) => n > 0 ? `+${n}` : n < 0 ? `${n}` : '0';
    const gapColor = (n) => n > 0 ? 'var(--green)' : n < 0 ? 'var(--red)' : 'var(--text-muted)';

    marketHtml = `
      <div class="card">
        <div class="card-title">Market Comparison (vs KTC)</div>
        <div class="rank-compare-grid">
          <div class="rank-compare-cell" style="border:1px solid rgba(59,130,246,0.2)">
            <div class="rank-label">TrueValue Rank</div>
            <div class="rank-primary" style="color:var(--accent)">${p.pos}${p.posRank}</div>
            <div class="rank-sub">#${p.rank} overall</div>
          </div>
          <div class="rank-compare-cell">
            <div class="rank-label">Market Rank (KTC)</div>
            <div class="rank-primary">${p.pos}${p.marketPosRank}</div>
            <div class="rank-sub">#${p.marketRank} overall</div>
          </div>
        </div>
        <div class="rank-diff-bar" style="background:var(--surface-2)">
          <span style="color:var(--text-muted)">Positional gap:</span>
          <span class="diff-num" style="color:${gapColor(posGap)}">${gapStr(posGap)} spots</span>
          <span style="color:var(--text-dim)">·</span>
          <span style="color:var(--text-muted)">Overall gap:</span>
          <span class="diff-num" style="color:${gapColor(overallGap)}">${gapStr(overallGap)}</span>
        </div>
        <div class="market-verdict" style="${verdict.cls}">
          ${verdict.text} <span style="opacity:0.7;font-weight:500;font-size:0.7rem">· ${verdict.desc}</span>
        </div>
      </div>`;
  }

  // Percentile computations (among players with positive value)
  const positiveValuePlayers = allPlayers.filter(x => x.value > 0);
  const posPlayers = positiveValuePlayers.filter(x => x.pos === p.pos);
  const overallBetter = positiveValuePlayers.filter(x => x.value > p.value).length;
  const overallPercentile = p.value > 0
    ? Math.max(1, Math.round(((positiveValuePlayers.length - overallBetter) / positiveValuePlayers.length) * 100))
    : null;
  const posBetter = posPlayers.filter(x => x.value > p.value).length;
  const posPercentile = p.value > 0
    ? Math.max(1, Math.round(((posPlayers.length - posBetter) / posPlayers.length) * 100))
    : null;
  const topOverall = overallPercentile ? 100 - overallPercentile + 1 : null;  // "Top X%"
  const topPos = posPercentile ? 100 - posPercentile + 1 : null;

  // Determine descriptive label based on top position percentile
  let contextLabel;
  if (topPos === null) contextLabel = 'Below waiver line';
  else if (topPos <= 5) contextLabel = `Cornerstone ${p.pos}`;
  else if (topPos <= 15) contextLabel = `Elite ${p.pos} asset`;
  else if (topPos <= 30) contextLabel = `High-end ${p.pos} starter`;
  else if (topPos <= 50) contextLabel = `Solid ${p.pos}`;
  else if (topPos <= 75) contextLabel = `Bench-level ${p.pos}`;
  else contextLabel = `Depth ${p.pos}`;

  // Build contextual tooltip data from global meta
  const peakAges = meta.peakAges || { QB: 26, RB: 23, WR: 24, TE: 24 };
  const peak = peakAges[p.pos] || 25;
  const eliteCounts = meta.eliteCounts || {};
  const replacementPpg = meta.replacementPpg || {};
  const eliteCountPos = eliteCounts[p.pos] ?? '—';
  const replPos = replacementPpg[p.pos] ?? '—';
  const eliteThresh = typeof replPos === 'number' ? (replPos * 1.5).toFixed(1) : '—';

  const phaseDir = p.phaseMult >= 1.05 ? 'Appreciating' : p.phaseMult <= 0.95 ? 'Depreciating' : 'At peak';
  const ageVsPeak = p.age <= peak ? `${(peak - p.age).toFixed(1)} years below peak — still gaining value`
                                   : `${(p.age - peak).toFixed(1)} years past peak — losing value with age`;

  // Value breakdown
  const breakdownItems = [
    {
      label: 'Production Value',
      value: p.productionValue?.toFixed(1) || '—',
      tooltip: `<strong>Production Value</strong><br>The raw fantasy value this player is projected to produce above waiver-wire replacement level, summed over 8 years with a 10% annual discount rate applied. Weighted by survival probability each year.<span class="ctx">Replacement ${p.pos}: ${replPos} PPG · Your proj: ${p.predPpg} PPG</span>`
    },
    {
      label: 'Career Phase',
      value: `×${p.phaseMult.toFixed(2)}`,
      pct: Math.min(100, (p.phaseMult / 1.8) * 100),
      color: p.phaseMult >= 1 ? 'var(--green)' : 'var(--red)',
      tooltip: `<strong>Career Phase</strong><br>Dynasty premium/discount based on age curve. Players below peak age are appreciating assets; past peak they depreciate. Production-aware — still-elite veterans depreciate slower.<span class="ctx">${p.pos} peak age: ${peak} · Current age: ${p.age}<br>${phaseDir} · ${ageVsPeak}</span>`
    },
    {
      label: 'Ceiling Premium',
      value: `×${p.ceilingMult.toFixed(2)}`,
      pct: Math.min(100, ((p.ceilingMult - 0.9) / 0.35) * 100),
      color: 'var(--purple)',
      tooltip: `<strong>Ceiling Premium</strong><br>Bonus for players with high upside in their projection range — specifically how much the 90th percentile exceeds the mean projection. Youth amplifies this (young + high ceiling = dynasty gold).<span class="ctx">Range: ${p.valueLow.toLocaleString()} — ${p.valueHigh.toLocaleString()}</span>`
    },
    {
      label: 'Positional Scarcity',
      value: `×${p.scarcityMult.toFixed(2)}`,
      pct: Math.min(100, ((p.scarcityMult - 0.9) / 0.7) * 100),
      color: 'var(--yellow)',
      tooltip: `<strong>Positional Scarcity</strong><br>Rarity of elite talent at this position right now. Counts players scoring ≥1.5× replacement PPG (${p.pos} elite threshold: ${eliteThresh} PPG). Fewer elite options = higher premium.<span class="ctx">Current elite ${p.pos}s: <strong>${eliteCountPos}</strong><br>15+ elite = no premium · Cap: ×1.60</span>`
    },
  ];

  const breakdownHtml = breakdownItems.map(item => `
    <div class="breakdown-row">
      <span class="breakdown-label">
        ${item.label}
        <span class="help-icon">?<span class="tooltip">${item.tooltip}</span></span>
      </span>
      ${item.pct !== undefined ? `<div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:${item.pct}%;background:${item.color}"></div></div>` : '<div style="flex:1"></div>'}
      <span class="breakdown-value">${item.value}</span>
    </div>
  `).join('');

  // Strengths & Weaknesses
  const swHtml = (items, type) => items.map(item => `
    <li class="sw-item ${item.impact === 'high' ? (type + '-item impact-high') : ''}">
      <div class="sw-icon ${type}">${type === 'strength' ? '&#9650;' : '&#9660;'}</div>
      <div>
        <div class="sw-label">${item.label}</div>
        <div class="sw-detail">${item.detail}</div>
      </div>
    </li>
  `).join('');

  // Latest season stats
  const latest = p.history && p.history.length > 0 ? p.history[p.history.length - 1] : null;
  let statsHtml = '';
  if (latest) {
    const stats = [];
    stats.push({ label: 'Games', val: latest.games || '—' });
    stats.push({ label: 'PPG', val: latest.ppg?.toFixed(1) || '—' });
    stats.push({ label: 'Total Pts', val: latest.fantasy_points_ppr?.toFixed(0) || '—' });

    if (p.pos === 'QB') {
      if (latest.passing_yards) stats.push({ label: 'Pass Yds', val: latest.passing_yards.toLocaleString() });
      if (latest.passing_tds) stats.push({ label: 'Pass TD', val: latest.passing_tds });
      if (latest.interceptions != null) stats.push({ label: 'INT', val: latest.interceptions });
      if (latest.rushing_yards) stats.push({ label: 'Rush Yds', val: latest.rushing_yards.toLocaleString() });
      if (latest.rushing_tds) stats.push({ label: 'Rush TD', val: latest.rushing_tds });
    } else if (p.pos === 'RB') {
      if (latest.rushing_yards) stats.push({ label: 'Rush Yds', val: latest.rushing_yards.toLocaleString() });
      if (latest.rushing_tds) stats.push({ label: 'Rush TD', val: latest.rushing_tds });
      if (latest.carries) stats.push({ label: 'Carries', val: latest.carries });
      if (latest.receptions) stats.push({ label: 'Rec', val: latest.receptions });
      if (latest.receiving_yards) stats.push({ label: 'Rec Yds', val: latest.receiving_yards.toLocaleString() });
      if (latest.targets) stats.push({ label: 'Targets', val: latest.targets });
    } else if (p.pos === 'WR' || p.pos === 'TE') {
      if (latest.receptions) stats.push({ label: 'Rec', val: latest.receptions });
      if (latest.targets) stats.push({ label: 'Targets', val: latest.targets });
      if (latest.receiving_yards) stats.push({ label: 'Rec Yds', val: latest.receiving_yards.toLocaleString() });
      if (latest.receiving_tds) stats.push({ label: 'Rec TD', val: latest.receiving_tds });
      if (latest.target_share) stats.push({ label: 'Tgt Share', val: (latest.target_share * 100).toFixed(1) + '%' });
    }

    statsHtml = `
      <div class="card">
        <div class="card-title">Latest Season Stats (${latest.season})</div>
        <div class="stats-grid">
          ${stats.map(s => `<div class="stat-box"><div class="stat-val">${s.val}</div><div class="stat-label">${s.label}</div></div>`).join('')}
        </div>
      </div>`;
  }

  // Season history table
  let historyTableHtml = '';
  if (p.history && p.history.length > 0) {
    const isPassPos = p.pos === 'QB';
    const histRows = [...p.history].reverse();
    historyTableHtml = `
      <div class="card full-width">
        <div class="card-title">Season History</div>
        <table class="history-table">
          <thead><tr>
            <th>Year</th><th>Team</th><th>G</th><th>PPG</th><th>Total</th>
            ${isPassPos ? '<th>Pass Yds</th><th>Pass TD</th><th>INT</th><th>Rush Yds</th>'
              : p.pos === 'RB' ? '<th>Rush Yds</th><th>Rush TD</th><th>Rec</th><th>Rec Yds</th>'
              : '<th>Rec</th><th>Targets</th><th>Rec Yds</th><th>Rec TD</th>'}
          </tr></thead>
          <tbody>
            ${histRows.map(s => {
              const team = s.recent_team || '—';
              return `<tr>
                <td style="font-weight:600">${s.season}</td>
                <td>${team}</td>
                <td>${s.games || '—'}</td>
                <td style="font-weight:600">${s.ppg?.toFixed(1) || '—'}</td>
                <td>${s.fantasy_points_ppr?.toFixed(0) || '—'}</td>
                ${isPassPos ? `<td>${s.passing_yards?.toLocaleString() || '—'}</td><td>${s.passing_tds || '—'}</td><td>${s.interceptions ?? '—'}</td><td>${s.rushing_yards?.toLocaleString() || '—'}</td>`
                  : p.pos === 'RB' ? `<td>${s.rushing_yards?.toLocaleString() || '—'}</td><td>${s.rushing_tds || '—'}</td><td>${s.receptions || '—'}</td><td>${s.receiving_yards?.toLocaleString() || '—'}</td>`
                  : `<td>${s.receptions || '—'}</td><td>${s.targets || '—'}</td><td>${s.receiving_yards?.toLocaleString() || '—'}</td><td>${s.receiving_tds || '—'}</td>`}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  document.getElementById('app').innerHTML = `
    <a href="index.html" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Rankings
    </a>

    <div class="player-header">
      <div class="player-photo">${photoHtml}</div>
      <div class="player-info">
        <h1>${p.name}</h1>
        <div class="player-meta">
          <span class="pos-badge pos-${p.pos}">${p.pos}</span>
          <span class="tier-badge tier-${p.tier}">${p.tier}</span>
          <span class="meta-text">Age ${p.age}${teamStr}${missedStr}</span>
        </div>
      </div>
      <div class="header-value">
        <div class="big-value" style="color:${posColor(p.pos)}">${p.value.toLocaleString()}</div>
        <div class="value-label">Dynasty Value</div>
        <div class="value-range-text">${p.valueLow.toLocaleString()} — ${p.valueHigh.toLocaleString()}</div>
        <div class="rank-text">#${p.rank} Overall</div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Value Breakdown -->
      <div class="card">
        <div class="card-title">Value Breakdown</div>
        ${breakdownHtml}
        <div class="breakdown-row" style="margin-top:0.5rem;padding-top:0.75rem;border-top:2px solid var(--border)">
          <span class="breakdown-label" style="font-weight:700;color:var(--text)">Total Asset Multiplier</span>
          <span class="breakdown-total">×${p.assetMult.toFixed(2)}</span>
        </div>
        <div class="breakdown-row">
          <span class="breakdown-label" style="font-weight:700;color:var(--text)">Final Dynasty Value</span>
          <span class="breakdown-total">${p.value.toLocaleString()}</span>
        </div>

        <!-- Value Context -->
        ${p.value > 0 ? `
        <div class="value-context">
          <div class="context-label-row">
            <div>
              <div class="context-big-label">${contextLabel}</div>
              <div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.2rem">Ranks #${p.posRank} of ${posPlayers.length} ${p.pos}s · #${p.rank} of ${positiveValuePlayers.length} ranked</div>
            </div>
            <span class="context-tier-chip tier-${p.tier}" style="background:var(--${p.tier === 'Elite' ? 'purple' : p.tier === 'Star' ? 'accent' : p.tier === 'Starter' ? 'green' : p.tier === 'Bench' ? 'yellow' : 'text-muted'}-bg);color:var(--${p.tier === 'Elite' ? 'purple' : p.tier === 'Star' ? 'accent' : p.tier === 'Starter' ? 'green' : p.tier === 'Bench' ? 'yellow' : 'text-muted'})">${p.tier}</span>
          </div>

          <div class="percentile-bar-group">
            <div class="percentile-bar-label">
              <span>Position percentile</span>
              <span class="percentile-val">Top ${topPos}% of ${p.pos}s</span>
            </div>
            <div class="percentile-bar-track">
              <div class="percentile-bar-fill" style="width:${posPercentile}%"></div>
            </div>
          </div>

          <div class="percentile-bar-group">
            <div class="percentile-bar-label">
              <span>Overall percentile</span>
              <span class="percentile-val">Top ${topOverall}% of all players</span>
            </div>
            <div class="percentile-bar-track">
              <div class="percentile-bar-fill dim" style="width:${overallPercentile}%"></div>
            </div>
          </div>
        </div>
        ` : ''}
      </div>

      <!-- Market Comparison / Key Numbers -->
      <div style="display:flex;flex-direction:column;gap:1rem;">
        ${marketHtml || `<div class="card"><div class="card-title">Market Comparison</div><div style="text-align:center;color:var(--text-muted);padding:1.5rem 0;font-size:0.85rem">No market data available</div></div>`}
        <div class="card" style="flex:1">
          <div class="card-title">Key Metrics</div>
          <div class="stats-grid">
            <div class="stat-box"><div class="stat-val">${p.ppg}</div><div class="stat-label">Current PPG</div></div>
            <div class="stat-box"><div class="stat-val">${p.predPpg}</div><div class="stat-label">Proj PPG</div></div>
            <div class="stat-box"><div class="stat-val">${p.consistency.toFixed(2)}</div><div class="stat-label">Consistency</div></div>
            <div class="stat-box"><div class="stat-val">${p.replacementPpg}</div><div class="stat-label">Repl Level</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Projection Chart -->
      <div class="card">
        <div class="card-title">8-Year PPG Projection</div>
        <div class="chart-container"><canvas id="projChart"></canvas></div>
      </div>

      <!-- Survival Curve -->
      <div class="card">
        <div class="card-title">Cumulative Survival Probability</div>
        <div class="chart-container"><canvas id="survChart"></canvas></div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Strengths -->
      <div class="card">
        <div class="card-title">Strengths</div>
        ${p.strengths.length > 0
          ? `<ul class="sw-list">${swHtml(p.strengths, 'strength')}</ul>`
          : '<div style="color:var(--text-muted);font-size:0.85rem;padding:0.5rem 0">No notable strengths identified</div>'}
      </div>

      <!-- Weaknesses -->
      <div class="card">
        <div class="card-title">Weaknesses</div>
        ${p.weaknesses.length > 0
          ? `<ul class="sw-list">${swHtml(p.weaknesses, 'weakness')}</ul>`
          : '<div style="color:var(--text-muted);font-size:0.85rem;padding:0.5rem 0">No notable weaknesses identified</div>'}
      </div>
    </div>

    ${statsHtml}
    ${historyTableHtml}

    ${p.history && p.history.length >= 2 ? `
    <div class="card" style="margin-top:1rem">
      <div class="card-title">Historical PPG Trend</div>
      <div class="chart-container"><canvas id="histChart"></canvas></div>
    </div>` : ''}
  `;

  // Render charts
  renderProjectionChart(p);
  renderSurvivalChart(p);
  if (p.history && p.history.length >= 2) renderHistoryChart(p);
}

function renderProjectionChart(p) {
  const ctx = document.getElementById('projChart');
  if (!ctx || !p.projections || p.projections.length === 0) return;

  const labels = p.projections.map(pr => `Yr ${pr.year}`);
  const means = p.projections.map(pr => pr.ppgMean);
  const lows = p.projections.map(pr => pr.ppgLow);
  const highs = p.projections.map(pr => pr.ppgHigh);

  const pc = posColor(p.pos);
  const pcRgb = { QB: '239,68,68', RB: '59,130,246', WR: '16,185,129', TE: '245,158,11' }[p.pos] || '59,130,246';

  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Projected PPG',
          data: means,
          borderColor: pc,
          backgroundColor: `rgba(${pcRgb},0.1)`,
          borderWidth: 2.5,
          fill: false,
          tension: 0.3,
          pointRadius: 4,
          pointBackgroundColor: pc,
        },
        {
          label: 'Ceiling (90th)',
          data: highs,
          borderColor: `rgba(${pcRgb},0.3)`,
          backgroundColor: `rgba(${pcRgb},0.06)`,
          borderWidth: 1,
          borderDash: [4, 3],
          fill: '+1',
          tension: 0.3,
          pointRadius: 0,
        },
        {
          label: 'Floor (10th)',
          data: lows,
          borderColor: `rgba(${pcRgb},0.3)`,
          backgroundColor: 'transparent',
          borderWidth: 1,
          borderDash: [4, 3],
          fill: false,
          tension: 0.3,
          pointRadius: 0,
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a2234',
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          borderColor: '#1e2a3a',
          borderWidth: 1,
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} PPG`
          }
        }
      },
      scales: {
        x: { ticks: { color: '#64748b', font: { size: 11 } }, grid: { color: 'rgba(30,42,58,0.5)' } },
        y: {
          ticks: { color: '#64748b', font: { size: 11 }, callback: v => v.toFixed(0) },
          grid: { color: 'rgba(30,42,58,0.5)' },
          suggestedMin: 0,
        }
      }
    }
  });
}

function renderSurvivalChart(p) {
  const ctx = document.getElementById('survChart');
  if (!ctx || !p.projections || p.projections.length === 0) return;

  const labels = p.projections.map(pr => `Yr ${pr.year}`);
  const survPcts = p.projections.map(pr => (pr.survival * 100));

  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Survival %',
        data: survPcts,
        borderColor: '#a78bfa',
        backgroundColor: 'rgba(167,139,250,0.08)',
        borderWidth: 2.5,
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: '#a78bfa',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a2234',
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          borderColor: '#1e2a3a',
          borderWidth: 1,
          callbacks: {
            label: ctx => `${ctx.parsed.y.toFixed(1)}% chance still active`
          }
        }
      },
      scales: {
        x: { ticks: { color: '#64748b', font: { size: 11 } }, grid: { color: 'rgba(30,42,58,0.5)' } },
        y: {
          ticks: { color: '#64748b', font: { size: 11 }, callback: v => v + '%' },
          grid: { color: 'rgba(30,42,58,0.5)' },
          min: 0,
          max: 100,
        }
      }
    }
  });
}

function renderHistoryChart(p) {
  const ctx = document.getElementById('histChart');
  if (!ctx) return;

  const labels = p.history.map(s => s.season.toString());
  const ppgs = p.history.map(s => s.ppg);

  const pc = posColor(p.pos);
  const pcRgb = { QB: '239,68,68', RB: '59,130,246', WR: '16,185,129', TE: '245,158,11' }[p.pos] || '59,130,246';

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'PPG',
        data: ppgs,
        backgroundColor: `rgba(${pcRgb},0.4)`,
        borderColor: pc,
        borderWidth: 1.5,
        borderRadius: 6,
        barPercentage: 0.6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a2234',
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          borderColor: '#1e2a3a',
          borderWidth: 1,
          callbacks: {
            label: ctx => `${ctx.parsed.y.toFixed(1)} PPG`
          }
        }
      },
      scales: {
        x: { ticks: { color: '#64748b', font: { size: 11 } }, grid: { display: false } },
        y: {
          ticks: { color: '#64748b', font: { size: 11 } },
          grid: { color: 'rgba(30,42,58,0.5)' },
          suggestedMin: 0,
        }
      }
    }
  });
}

init();
</script>
</body>
</html>
